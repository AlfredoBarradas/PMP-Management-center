<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PMP Management Center</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Main application container -->
    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-header">
                <h1>PMP</h1>
                <p>Plastic and Metal Parts Process Control</p>
            </div>

            <nav class="sidebar-menu">

                <a href="index.html">Dashboard</a>

                <a href="#">Documents</a>

                <a href="#">Losstime</a>

                <a href="#">Efficiency</a>

                <a href="#">Scrap</a>

                <a href="#">Hour by Hour</a>

                <a href="#">New Models</a>

                <a href="#">Production Release</a>

            </nav>

            <div class="sidebar-footer">

                <a href="#">Settings</a>

                <a href="#">Account</a>

            </div>

        </aside>


        <!-- Main content -->
        <main class="main-content">

            <!-- Header -->
            <header class="topbar">

                <div class="page-title">
                    <h2>Dashboard</h2>
                </div>

                <div class="user-menu">

                    <button>🌐 EN</button>

                    <button>🔔</button>

                    <div class="user-info">
                        <strong>User Name</strong>
                        <span>PE-PMP</span>
                    </div>

                </div>

            </header>


            <!-- Dashboard content -->
            <section class="content">

                <h2>Process Overview</h2>

                <div class="dashboard-grid">

                    <button class="dashboard-card">
                        <h3>Documents</h3>
                        <p>128</p>
                    </button>

                    <button class="dashboard-card">
                        <h3>Losstime</h3>
                        <p>124 h</p>
                    </button>

                    <button class="dashboard-card">
                        <h3>Efficiency</h3>
                        <p>91.5%</p>
                    </button>

                    <button class="dashboard-card">
                        <h3>Scrap</h3>
                        <p>2.4%</p>
                    </button>

                    <button class="dashboard-card">
                        <h3>Hour by Hour</h3>
                        <p>Production</p>
                    </button>

                    <button class="dashboard-card">
                        <h3>New Models</h3>
                        <p>6</p>
                    </button>

                    <button class="dashboard-card">
                        <h3>Production Release</h3>
                        <p>18</p>
                    </button>

                </div>


                <h2>Document Control</h2>

                <div class="document-status">

                    <div>
                        <span>Pending Validation</span>
                        <strong>8</strong>
                    </div>

                    <div>
                        <span>Pending Approval</span>
                        <strong>5</strong>
                    </div>

                    <div>
                        <span>Pending Release</span>
                        <strong>3</strong>
                    </div>

                </div>

            </section>

        </main>

    </div>

</body>

</html>
