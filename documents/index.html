<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PMP Documents</title>
    <link rel="icon" href="/pmp-favicon.ico">

    <link rel="stylesheet" href="/css/style.css">
</head>

<body data-page="Documents">
    <div class="app">

        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Main content -->
        <main class="main-content">
            <!-- Header -->
            <header id="topbar-container"></header>

            <!-- Dashboard content -->
            <section class="content">
                <h2>Process Overview</h2>

                <div class="dashboard-grid">

                    <button class="dashboard-card">
                        <h3>Procedures</h3>
                        <p>pending</p>
                    </button>

                    <button class="dashboard-card">
                        <h3>SOP</h3>
                        <p>pending</p>
                    </button>

                    <button class="dashboard-card">
                        <h3>LAYOUT</h3>
                        <p>pending</p>
                    </button>

                    <button class="dashboard-card">
                        <h3>MDR - REWORKS</h3>
                        <p>pending</p>
                    </button>

                    <button class="dashboard-card">
                        <h3>TECHNICAL INFORMATION</h3>
                        <p>pending</p>
                    </button>

                    <button class="dashboard-card">
                        <h3>Flow Charts</h3>
                        <p>pending</p>
                    </button>

                    <button class="dashboard-card">
                        <h3>PFMEA</h3>
                        <p>pending</p>
                    </button>

                </div>


                <h2>Document Control</h2>

                <div class="document-status">

                    <div>
                        <span>Pending Validation</span>
                        <strong>8</strong>
                    </div>

                    <div>
                        <span>Pending Approval</span>
                        <strong>5</strong>
                    </div>

                    <div>
                        <span>Pending Release</span>
                        <strong>3</strong>
                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- JavaScript -->
    <script src="/components/sidebar/sidebar.js"></script>
    <script src="/components/topbar/topbar.js"></script>

</body>

</html>
