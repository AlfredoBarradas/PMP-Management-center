<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PMP Documents</title>
    <link rel="icon" href="/pmp-favicon.ico">

    <link rel="stylesheet" href="/css/style.css">
</head>

<body data-page="Documents">
    <div class="app">

        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Main content -->
        <main class="main-content">
            <!-- Header -->
            <header id="topbar-container"></header>

            <!-- Dashboard content -->
            <section class="content">
                <h2>Process Overview</h2>

                <div class="dashboard-grid">

                    <a href="/documents/procedures/" class="dashboard-card">
                        <h3>Procedures</h3>
                        <p>pending</p>
                    </a>

                    <a href="/documents/sop/" class="dashboard-card">
                        <h3>SOP</h3>
                        <p>pending</p>
                    </a>

                    <a href="/documents/layouts/" class="dashboard-card">
                        <h3>Layouts</h3>
                        <p>pending</p>
                    </a>

                    <a href="/documents/reworks/" class="dashboard-card">
                        <h3>MDR - REWORKS</h3>
                        <p>pending</p>
                    </a>

                    <a href="/documents/technicals/" class="dashboard-card">
                        <h3>Technical Information</h3>
                        <p>pending</p>
                    </a>

                    <a href="/documents/flow_charts/" class="dashboard-card">
                        <h3>Flow Charts</h3>
                        <p>pending</p>
                    </a>

                </div>


                <h2>Document Control</h2>

                <div class="document-status">

                    <div>
                        <span>Pending Validation</span>
                        <strong>8</strong>
                    </div>

                    <div>
                        <span>Pending Approval</span>
                        <strong>5</strong>
                    </div>

                    <div>
                        <span>Pending Release</span>
                        <strong>3</strong>
                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>

    <script src="/components/sidebar/sidebar.js"></script>
    <script src="/components/topbar/topbar.js"></script>


</body>

</html>
